server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: authapp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authapp}
    username: ${DB_USER:authapp}
    password: ${DB_PASS:authapp}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-in-env-minimum-32-characters-long}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    cookie-name: access_token
  cors:
    allowed-origin: ${FRONTEND_URL:http://localhost:4200}
  cookie:
    secure: ${COOKIE_SECURE:false}
  oauth2:
    google:
      # OAuth2 Client ID from Google Cloud Console (Credentials > OAuth client ID > Web application).
      # Only the Client ID is needed — ID-token verification doesn't use the client secret.
      client-id: ${GOOGLE_CLIENT_ID:}
  passkey:
    # WebAuthn Relying Party ID: must be the frontend's domain (no scheme/port),
    # or a parent domain of it. "localhost" works for local dev because browsers
    # treat http://localhost as a secure context. Update this (and passkey-origin)
    # to the real Render frontend domain in Step 4 — a passkey created under one
    # RP ID cannot be used to log in under a different one.
    rp-id: ${PASSKEY_RP_ID:localhost}
    rp-name: ${PASSKEY_RP_NAME:Auth App}
    # Must exactly match the frontend origin the browser sends (scheme+host+port).
    origin: ${PASSKEY_ORIGIN:http://localhost:4200}

logging:
  level:
    com.example.authapp: DEBUG
