<div class="auth-shell">
  <div class="card">
    <h1 class="card-title">Đổi mật khẩu</h1>

    @if (errorMessage()) {
      <div class="form-alert">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="form-alert form-alert-success">{{ successMessage() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="currentPassword">Mật khẩu hiện tại</label>
        <input id="currentPassword" type="password" name="currentPassword" [(ngModel)]="currentPassword" autocomplete="current-password" />
      </div>

      <div class="field">
        <label for="newPassword">Mật khẩu mới</label>
        <input id="newPassword" type="password" name="newPassword" [(ngModel)]="newPassword" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirmNewPassword">Nhập lại mật khẩu mới</label>
        <input id="confirmNewPassword" type="password" name="confirmNewPassword" [(ngModel)]="confirmNewPassword" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'Đang lưu...' : 'Lưu thay đổi' }}
      </button>
    </form>

    <p class="footer-note">
      <a routerLink="/menu">← Quay lại Menu</a>
    </p>
  </div>
</div>
