<div class="auth-shell">
  <div class="card">
    <h1 class="card-title">Tạo mật khẩu</h1>
    <p class="card-subtitle">Bước 2/4 — Đặt mật khẩu cho tài khoản.</p>

    @if (errorMessage()) {
      <div class="form-alert">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()">
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" [(ngModel)]="password" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="confirmPassword">Nhập lại mật khẩu</label>
        <input id="confirmPassword" type="password" name="confirmPassword" [(ngModel)]="confirmPassword" autocomplete="new-password" />
      </div>

      <button type="submit" class="btn btn-primary">Tiếp tục</button>
    </form>
  </div>
</div>
